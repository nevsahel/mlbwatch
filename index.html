<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Watchability Index</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            padding: 20px;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        .hero h1 {
            font-family: 'Georgia', serif;
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: 900;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin: 0;
            text-shadow: 0 0 40px rgba(245, 158, 11, 0.3);
        }

        .selector-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .sport-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 20px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .sport-card:hover,
        .sport-card:focus-visible {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            outline: none;
        }

        .sport-card:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 4px;
        }

        .sport-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
            transition: transform 0.3s ease;
        }

        .sport-card:hover .sport-icon,
        .sport-card:focus-visible .sport-icon {
            transform: scale(1.1);
        }

        @media (prefers-reduced-motion: reduce) {
            .sport-card, .sport-icon, .live-count {
                animation: none !important;
                transition: none !important;
            }
            .sport-card:hover, .sport-card:focus-visible {
                transform: none !important;
            }
        }

        .sport-name {
            font-family: 'Georgia', serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        .peek-container {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px 15px;
            width: 100%;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .peek-content {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .live-count {
            background: #ff4444;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            animation: pulse 2s infinite;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
        }

        @media (max-width: 800px) {
            body { overflow-y: auto; padding: 40px 20px; }
            .selector-container { flex-direction: column; align-items: center; }
            .sport-card { width: 100%; max-width: 350px; }
        }
    </style>
</head>
<body>
    <header style="width: 100%; justify-content: flex-start; padding: 16px 40px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); position: fixed; top: 0; z-index: 1000;">
        <nav class="main-nav" aria-label="Main navigation" style="margin-left: 0;">
            <a href="index.html" aria-current="page">Home</a>
            <a href="mlb.html">MLB</a>
            <a href="nba.html">NBA</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Sports Watchability Index</h1>
    </div>

    <div class="selector-container">
        <a href="mlb.html" class="sport-card" id="mlb-card">
            <div class="sport-icon" aria-hidden="true">⚾</div>
            <div class="sport-name">MLB</div>
            <div class="peek-container" id="mlb-peek">
                <div class="peek-content">Connecting to StatsAPI...</div>
            </div>
        </a>

        <a href="nba.html" class="sport-card" id="nba-card">
            <div class="sport-icon" aria-hidden="true">🏀</div>
            <div class="sport-name">NBA</div>
            <div class="peek-container" id="nba-peek">
                <div class="peek-content">Connecting to ESPN API...</div>
            </div>
        </a>
    </div>

    <script src="utils/core.js"></script>
    <script src="utils/performance.js"></script>
    <script src="js/landing.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch((e) => {}));
    }
    </script>
</body>
</html>
